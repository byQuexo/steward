id: 08-fiona-budget
title: "Fiona stößt an das Budget"
description: Ein Lauf darf höchstens 0,02 Euro kosten (ein echter Lauf kostet 0,001 bis 0,003 Euro); der Budget-Hook stoppt vor dem nächsten Modellaufruf.
user: fiona
usage: { input_tokens: 60000, output_tokens: 1500 }
turns:
  - user: "Wie hoch ist das Hotel-Limit in München?"
    script:
      - tool: { name: docs.search, args: { question: "Hotelkosten Limit München", doc_ids: [] } }
      - say: "In München liegt das Limit bei 180 Euro pro Nacht."
    expect:
      - budget_exceeded
