# yaml-language-server: $schema=https://raw.githubusercontent.com/byQuexo/warden/main/spec/schema/catalog.schema.json
# GENERATED by `steward profile generate` from profiles/devteam/connectors/ and catalog.extra.yaml.
# Do not edit; change the connector files instead.
version: 1

tool:
  # Team Chat (Mock) (chat)
  chat.list_channels: { scopes: [chat:read] }
  chat.post_message: { scopes: [chat:write], sensitivity: write }
  # Engineering Docs (docs)
  docs.list_documents: { scopes: [docs:read] }
  docs.search: { scopes: [docs:read] }
  # GitHub (Mock) (github)
  github.create_issue: { scopes: [github:write], sensitivity: write, tags: [repo-scoped] }
  github.list_issues: { scopes: [github:read], tags: [repo-scoped] }
  github.list_pulls: { scopes: [github:read], tags: [repo-scoped] }
  github.merge_pull_request: { scopes: [github:write], sensitivity: write, tags: [repo-scoped, merge] }
  # Incident Queue (ticket)
  ticket.close: { scopes: [ticket:write], sensitivity: write }
  ticket.comment: { scopes: [ticket:write], sensitivity: write }
  ticket.create: { scopes: [ticket:create], sensitivity: write }
  ticket.get: { scopes: [ticket:read] }
  ticket.list: { scopes: [ticket:read] }

# --- catalog.extra.yaml ---
# Catalog entries that do not come from MCP connectors. Appended to the generated catalog.

# Steward's memory: checked in-process by warden-core, so memory access shows up in evals.
x-memory:
  memory.read_own:  { scopes: [memory:own], tags: [owner-scoped] }
  memory.write:     { scopes: [memory:own], sensitivity: write, tags: [owner-scoped] }
  memory.forget:    { scopes: [memory:own], sensitivity: write, tags: [owner-scoped] }
  memory.read_team: { scopes: [memory:team] }

# Page images of documents, fetched through the assistant (re-checked on every fetch).
x-docs-page:
  docs.page: { scopes: [docs:read] }

# Skills of the A2A sub-agents. Delegated writes are approved where they happen: at the gateway.
a2a_skill:
  research.deep_search: { scopes: [research] }
  action.create_issue:  { scopes: [github:write], sensitivity: write }
  action.post_update:   { scopes: [chat:write], sensitivity: write }
