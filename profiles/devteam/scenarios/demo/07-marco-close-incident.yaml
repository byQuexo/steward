id: 07-marco-close-incident
title: "Marco closes an incident, on-call declines"
description: Closing an incident is confirmed by the on-call SRE; Sam declines because the error rate is still being watched.
user: marco
turns:
  - user: "Close incident t-4101, the payments outage is resolved"
    script:
      - tool: { name: ticket.close, args: { ticket_id: t-4101 } }
      - say: "The on-call SRE declined closing t-4101; the incident stays open."
    expect:
      - decision: { tool: ticket.close, effect: require_approval, rule: incident-close-needs-oncall }
      - approval: { approver: sam, decide: deny }
      - not_executed: ticket.close
