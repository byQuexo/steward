# Documents per team (doc id patterns). The seed writes each user's resulting list into the
# `doc_scope` claim; Warden checks every docs.search with `subset_of: {subject.attrs.doc_scope}`
# and the docs server cuts results to the same list. Security documents: security team only.
teams:
  platform: [handbook-*, eng-*, oncall-*]
  payments: [handbook-*, eng-*, oncall-*]
  oncall:   [handbook-*, eng-*, oncall-*]
  product:  [handbook-*, eng-release-process]
  security: [handbook-*, eng-*, oncall-*, security-*]
