<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080808" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Steward</title>
    <script>
      // Apply the stored theme before the first paint (no flash). Dark is the default (DESIGN.md).
      (function () {
        var dark = true;
        try {
          var t = localStorage.getItem('steward.theme');
          if (t === 'light') dark = false;
          else if (t === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
