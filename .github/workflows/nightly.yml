name: Nightly quality eval

# The full question set with a real model and an LLM judge. Needs the OPENROUTER_API_KEY
# secret and costs money per run (see eval/README.md). Without the secret NO eval runs: the
# `eval` job is marked "skipped" (grey), not passed, and the run summary says so. A skipped
# nightly is not a quality signal.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

jobs:
  key:
    # `secrets` is not available in a job-level `if`, so a tiny job checks for the key and
    # the eval job depends on its output.
    name: Check for OPENROUTER_API_KEY
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Quality eval SKIPPED::OPENROUTER_API_KEY is not set, so no real-model eval ran. This run says nothing about answer quality."
            {
              echo "## Quality eval: SKIPPED"
              echo
              echo "\`OPENROUTER_API_KEY\` is not set, so the real-model eval did not run."
              echo "This is **not** a passing quality result; the \`eval\` job is marked skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  eval:
    name: Full eval with a real model and judge
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --release --locked -p steward
      - name: Full eval with a real model and judge
        run: |
          ./target/release/steward demo --profile profiles/acme --listen 127.0.0.1:8000 > "$RUNNER_TEMP/demo.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          cd eval
          uv sync --locked
          uv run steward-eval --base http://127.0.0.1:8000 --profile ../profiles/acme --gate --judge-model openrouter/deepseek/deepseek-v4.1-flash --report "$RUNNER_TEMP/eval.md" --json "$RUNNER_TEMP/eval.json"
          cat "$RUNNER_TEMP/eval.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: quality-eval, path: "${{ runner.temp }}/eval.*" }
