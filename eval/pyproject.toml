[project]
name = "steward-eval"
version = "0.1.0"
description = "Quality evaluation for Steward: ~80 questions over 7 users, rubric, LLM judge, kappa, bootstrap CIs and hard gates."
requires-python = ">=3.12,<3.14"
license = "MIT OR Apache-2.0"
dependencies = [
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pyyaml==6.0.3",
]

[project.scripts]
steward-eval = "steward_eval.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
